name: build e Publicacao de imagem Docker
on:

 push:
  branches: [ "main" ] # dispara ao realizar merge ou push na main

jobs:
  build-and-push:
  runs-on: ubuntu-latest

  steps:
   #step 1: baixar o codigo-fonte do repositorio
   - name: Baixar Codigo
     uses: actions/checkout@v4

   #step 2: configurar o docker buildx (ferramenta avançada para builds)
   - name: Configurar Docker Buildx
     uses: docker/setup-buildx-action@v3

   #step 3: Autentificar no docker hub usando secrets
   - name: Autenticar no docker Hub
     uses: docker/login-action@v3
     with:
       username: ${{ secrets.DOCKER_USERNAME }}
       password: ${{ secrets.DOCKER_PASSWORD }}

   #step 4: extrair metadados da para versionamento inteligente (tag SemVer e SHA)
   - name: Extrair Metadados do Docker
     id: meta
     uses: docker/metadata-action@v5
     with:
       images: ${{ secrets.DOCKER_USERNAME }}/docker_test_2
       tags: |
         type=raw, value=latest
         type=sha, format=short

   #step 5: construir e Publicar (build e push)
   - name: Construir e Publicar imagem
     uses: docker/build-push-action@v5
     with:
       context: .
       push: true
       tags: ${{ steps.meta.outputs.tags }}
       labels: ${{ steps.meta.outputs.labels }}


